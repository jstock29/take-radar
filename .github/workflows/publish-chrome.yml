name: Publish to Chrome Web Store

# Every push to main is tested and packaged. When the tests pass and
# manifest.json's version has no v<version> tag yet, the publish script asks
# the store what it already has: a version that's already published or
# submitted (e.g. by hand in the dashboard) is just tagged; otherwise it's
# uploaded, submitted for review, and then tagged.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: chrome-web-store
  cancel-in-progress: false

permissions:
  contents: write # to push the v<version> tag

env:
  CWS_EXTENSION_ID: ijehcepecdihklcfehpobebkdmbnelkg

jobs:
  test:
    uses: ./.github/workflows/test.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # tags, and the diff for the listing-assets check

      - name: Read version
        id: version
        run: |
          version=$(jq -r .version manifest.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "v$version is already tagged. Bump \`version\` in manifest.json to publish." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Package
        id: package
        run: echo "zip=$(scripts/package.sh)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v6
        with:
          name: take-radar-${{ steps.version.outputs.version }}
          path: ${{ steps.package.outputs.zip }}

      # Exchanges the key for a token directly. (google-github-actions/auth with
      # token_format: access_token would instead have the account impersonate
      # itself, which needs an extra IAM role.)
      - name: Authenticate to Google
        if: steps.version.outputs.release == 'true'
        id: auth
        env:
          CWS_SERVICE_ACCOUNT_KEY: ${{ secrets.CWS_SERVICE_ACCOUNT_KEY }}
        run: |
          token=$(node scripts/cws-token.mjs)
          echo "::add-mask::$token"
          echo "access_token=$token" >> "$GITHUB_OUTPUT"

      - name: Upload and submit for review
        if: steps.version.outputs.release == 'true'
        id: publish
        env:
          CWS_TOKEN: ${{ steps.auth.outputs.access_token }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
        run: scripts/cws-publish.sh "${{ steps.package.outputs.zip }}"

      - name: Tag release
        if: steps.version.outputs.release == 'true' && steps.publish.outputs.done == 'true'
        run: |
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"
          echo "v${{ steps.version.outputs.version }} is in the Chrome Web Store (state: ${{ steps.publish.outputs.state }})." >> "$GITHUB_STEP_SUMMARY"

      # The API can't change listing text or images, so flag when they change.
      - name: Flag listing changes
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: |
          changed=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- store-assets || true)
          if [ -n "$changed" ]; then
            echo "::warning::Store listing assets changed. Update them by hand in the Chrome Web Store dashboard."
            {
              echo "### Store listing needs a manual update"
              echo "The Chrome Web Store API can't change listing text or images. These files changed:"
              echo "$changed" | sed 's/^/- /'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
