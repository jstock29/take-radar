<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Take Radar</title>
    <style>
      :root {
        --bg: #f6f6f8;
        --card: #fff;
        --text: #1d1d1f;
        --muted: #6e6e73;
        --border: #e2e2e6;
        --accent: #2f6fed;
        --danger: #d93025;
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1c1c1e;
          --card: #2c2c2e;
          --text: #f2f2f7;
          --muted: #98989f;
          --border: #3a3a3c;
          --accent: #5e8ef7;
          --danger: #ff6961;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        width: 360px;
        margin: 0;
        font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        padding: 14px 16px 8px;
      }
      h1 {
        margin: 0;
        font-size: 16px;
      }
      #status {
        color: var(--muted);
        font-size: 12px;
        transition: opacity 0.3s;
      }
      main {
        padding: 0 12px;
        max-height: 440px;
        overflow-y: auto;
      }
      .empty {
        color: var(--muted);
        text-align: center;
        padding: 24px 0;
      }
      .list {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 10px;
        margin-bottom: 8px;
      }
      .list-header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 10px;
      }
      input[type="color"] {
        flex: none;
        width: 22px;
        height: 22px;
        padding: 0;
        border: none;
        border-radius: 50%;
        background: none;
        cursor: pointer;
      }
      input[type="color"]::-webkit-color-swatch-wrapper {
        padding: 0;
      }
      input[type="color"]::-webkit-color-swatch {
        border: 1px solid rgba(0, 0, 0, 0.15);
        border-radius: 50%;
      }
      .list-name {
        flex: 1;
        min-width: 0;
        padding: 4px 6px;
        border: 1px solid transparent;
        border-radius: 6px;
        background: none;
        color: inherit;
        font: inherit;
        font-weight: 600;
      }
      .list-name:hover {
        border-color: var(--border);
      }
      .list-name:focus {
        outline: none;
        border-color: var(--accent);
      }
      .count {
        flex: none;
        color: var(--muted);
        font-size: 12px;
      }
      .icon-btn {
        flex: none;
        width: 26px;
        height: 26px;
        border: none;
        border-radius: 6px;
        background: none;
        color: var(--muted);
        font-size: 14px;
        cursor: pointer;
      }
      .icon-btn:hover {
        background: var(--border);
        color: var(--text);
      }
      .icon-btn.delete:hover {
        color: var(--danger);
      }
      .icon-btn svg {
        display: block;
        margin: auto;
      }
      .toggle svg {
        transition: transform 0.15s;
      }
      .list.open .toggle svg {
        transform: rotate(90deg);
      }
      .list-body {
        display: none;
        padding: 0 10px 10px;
      }
      .list.open .list-body {
        display: block;
      }
      textarea {
        display: block;
        width: 100%;
        height: 160px;
        padding: 8px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--bg);
        color: inherit;
        font: 12px/1.5 ui-monospace, "SF Mono", Menlo, monospace;
        resize: vertical;
      }
      textarea:focus {
        outline: none;
        border-color: var(--accent);
      }
      footer {
        display: flex;
        gap: 8px;
        padding: 8px 12px 14px;
      }
      footer button {
        flex: 1;
        padding: 8px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--card);
        color: var(--text);
        font: inherit;
        font-weight: 500;
        cursor: pointer;
      }
      footer button:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
      #importFile {
        display: none;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Take Radar</h1>
      <span id="status"></span>
    </header>
    <main id="lists"></main>
    <footer>
      <button id="addListBtn">+ New list</button>
      <button id="importBtn">Import .txt / .csv</button>
      <input type="file" id="importFile" accept=".csv,.txt" />
    </footer>
    <script src="options.js"></script>
  </body>
</html>
